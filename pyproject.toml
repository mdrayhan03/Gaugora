[project]
name = "gaugora"
version = "0.1.0"
description = "Per-VM resource monitoring agent with Flask UI and email alerts"
readme = "README.md"
authors = [
    { name = "mdrayhan03", email = "phylosopherhossain2022@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3",
    "flask>=3.1.3",
    "psutil>=7.2.2",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.1.1",
    "waitress>=3.0.2",
]

[project.scripts]
gaugora = "gaugora.__main__:main"

[build-system]
requires = ["uv_build>=0.9.30,<0.10.0"]
build-backend = "uv_build"
